[package]
name = "Marvis"
version = "0.1.2"
description = "Private and Personal AI for all on desktop"
authors = ["Allen Chan <chenillen@gmail.com>"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "marvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "image-ico",
    # Powers transparent/glass windows; tauri-build's allowlist only
    # inspects this declaration, so it stays here — the feature is a
    # no-op when compiled off macOS.
    "macos-private-api",
] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
bytes = "1"
sha1 = "0.11"
sha2 = "0.10"
sherpa-onnx = "=1.13.8"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
toml = "0.8"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
cpal = "0.18.2"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Windows falls back to CSS frost and Linux keeps the webview's own
# surface, so the glass plugin and every AppKit/SCK dep is macOS-gated.
tauri-plugin-liquid-glass = { git = "https://github.com/chenillen/tauri-plugin-liquid-glass", tag = "v0.1.7" }
screencapturekit = { version = "10", features = ["macos_14_0"] }
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
# WGC frame capture + WASAPI loopback system audio + WinRT mic consent.
windows-capture = "2"
wasapi = "0.24"
windows = { version = "0.62", features = [
    "Devices_Enumeration",
    "Foundation",
    "Media_Capture",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# XDG portal consent + PipeWire frames; PulseAudio monitor for system
# audio (works against pipewire-pulse too). `pollster` drives the async
# portal handshake inside the capture worker thread.
ashpd = { version = "0.13", features = ["screencast", "tokio"] }
pipewire = "0.10"
libpulse-binding = "2.30"
pollster = "0.4"

[dev-dependencies]
# `test-util` enables `#[tokio::test(start_paused = true)]` so the
# screen-reader settle gate can be tested without real-time waits.
tokio = { version = "1", features = ["test-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
