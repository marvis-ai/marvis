<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Marvis mark">
  <!-- Marvis mark: a warm-dark rounded square holding the elements directly —
       a seeing iris and streaming text lines -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="#31302e"/>
  <circle cx="24" cy="17.5" r="7.5" fill="#78a1bb"/>
  <circle cx="24" cy="17.5" r="2.9" fill="#ffffff"/>
  <rect x="14" y="30" width="20" height="2.6" rx="1.3" fill="#f6f5f4"/>
  <rect x="17.5" y="34.8" width="13" height="2.6" rx="1.3" fill="#a39e98"/>
</svg>
