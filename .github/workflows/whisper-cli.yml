name: Build Whisper CLI

on:
  workflow_dispatch:
    inputs:
      package_app:
        description: 'Build release app bundles (requires a pre-provisioned signing certificate)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: whisper-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build whisper-cli (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Validate build metadata
        working-directory: apps/native/src-tauri
        run: bash scripts/build-whisper-cli.sh --check-only --target aarch64-apple-darwin

      - name: Build and validate whisper-cli
        working-directory: apps/native/src-tauri
        run: bash scripts/build-whisper-cli.sh --target aarch64-apple-darwin

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-aarch64-apple-darwin
          path: |
            apps/native/src-tauri/binaries/whisper-cli-aarch64-apple-darwin
            apps/native/src-tauri/binaries/whisper-cli-aarch64-apple-darwin.sha256
          if-no-files-found: error

  build-x86-64:
    name: Build whisper-cli (x86_64)
    # macos-15-intel is the final supported Intel runner path.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Validate build metadata
        working-directory: apps/native/src-tauri
        run: bash scripts/build-whisper-cli.sh --check-only --target x86_64-apple-darwin

      - name: Build and validate whisper-cli
        working-directory: apps/native/src-tauri
        run: bash scripts/build-whisper-cli.sh --target x86_64-apple-darwin

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-x86_64-apple-darwin
          path: |
            apps/native/src-tauri/binaries/whisper-cli-x86_64-apple-darwin
            apps/native/src-tauri/binaries/whisper-cli-x86_64-apple-darwin.sha256
          if-no-files-found: error

  build-windows:
    name: Build whisper-cli (windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Validate build metadata
        working-directory: apps/native/src-tauri
        run: bash scripts/build-whisper-cli.sh --check-only --target x86_64-pc-windows-msvc

      - name: Build and validate whisper-cli
        working-directory: apps/native/src-tauri
        run: bash scripts/build-whisper-cli.sh --target x86_64-pc-windows-msvc

      - name: Upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-x86_64-pc-windows-msvc
          path: |
            apps/native/src-tauri/binaries/whisper-cli-x86_64-pc-windows-msvc.exe
            apps/native/src-tauri/binaries/whisper-cli-x86_64-pc-windows-msvc.exe.sha256
          if-no-files-found: error

  build-linux:
    name: Build whisper-cli (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate build metadata
        working-directory: apps/native/src-tauri
        run: bash scripts/build-whisper-cli.sh --check-only --target x86_64-unknown-linux-gnu

      - name: Build and validate whisper-cli
        working-directory: apps/native/src-tauri
        run: bash scripts/build-whisper-cli.sh --target x86_64-unknown-linux-gnu

      - name: Upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-x86_64-unknown-linux-gnu
          path: |
            apps/native/src-tauri/binaries/whisper-cli-x86_64-unknown-linux-gnu
            apps/native/src-tauri/binaries/whisper-cli-x86_64-unknown-linux-gnu.sha256
          if-no-files-found: error

  package-arm64:
    name: Package Marvis release candidate (arm64)
    if: ${{ inputs.package_app == true }}
    needs: build-arm64
    # macos-26 image: apple-metal's Swift bridge uses macOS 26 SDK APIs
    # (MTLSamplerReductionMode etc.) — macos-15 can't compile it.
    runs-on: macos-26
    env:
      # "-" forces ad-hoc signing for unsigned test builds; provisioning the
      # APPLE_SIGNING_IDENTITY secret + its cert in the keychain upgrades to
      # a real Developer ID signature without touching the workflow.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whisper-cli-aarch64-apple-darwin
          path: /tmp/whisper-cli-aarch64-apple-darwin
      - name: Stage and validate exact arm64 artifact
        working-directory: apps/native/src-tauri
        run: |
          bash scripts/build-whisper-cli.sh --stage \
            /tmp/whisper-cli-aarch64-apple-darwin/whisper-cli-aarch64-apple-darwin \
            --checksum /tmp/whisper-cli-aarch64-apple-darwin/whisper-cli-aarch64-apple-darwin.sha256 \
            --target aarch64-apple-darwin
          bash scripts/check-task-2-packaging.sh --target aarch64-apple-darwin
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build arm64 release app (ad-hoc signed)
        working-directory: apps/native
        run: bun install --frozen-lockfile && bun run tauri build --target aarch64-apple-darwin
      - name: Verify signature and bundled architecture
        working-directory: apps/native/src-tauri
        run: bash scripts/verify-release-app.sh target/aarch64-apple-darwin/release/bundle/macos/Marvis.app aarch64-apple-darwin
      - name: Upload arm64 bundles
        uses: actions/upload-artifact@v4
        with:
          name: marvis-aarch64-apple-darwin
          path: |
            apps/native/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            apps/native/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

  package-x86-64:
    name: Package Marvis release candidate (x86_64)
    if: ${{ inputs.package_app == true }}
    needs: build-x86-64
    # macos-26 image: same macOS 26 SDK requirement. No GitHub Intel runner
    # ships it, so x86_64 cross-compiles on arm64 (apple-metal honors the
    # target arch via swift --triple).
    runs-on: macos-26
    env:
      # "-" forces ad-hoc signing for unsigned test builds; provisioning the
      # APPLE_SIGNING_IDENTITY secret + its cert in the keychain upgrades to
      # a real Developer ID signature without touching the workflow.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whisper-cli-x86_64-apple-darwin
          path: /tmp/whisper-cli-x86_64-apple-darwin
      - name: Stage and validate exact x86_64 artifact
        working-directory: apps/native/src-tauri
        run: |
          bash scripts/build-whisper-cli.sh --stage \
            /tmp/whisper-cli-x86_64-apple-darwin/whisper-cli-x86_64-apple-darwin \
            --checksum /tmp/whisper-cli-x86_64-apple-darwin/whisper-cli-x86_64-apple-darwin.sha256 \
            --target x86_64-apple-darwin
          bash scripts/check-task-2-packaging.sh --target x86_64-apple-darwin
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Add x86_64 Rust target
        run: rustup target add x86_64-apple-darwin
      - name: Build x86_64 release app (ad-hoc signed)
        working-directory: apps/native
        run: bun install --frozen-lockfile && bun run tauri build --target x86_64-apple-darwin
      - name: Verify signature and bundled architecture
        working-directory: apps/native/src-tauri
        run: bash scripts/verify-release-app.sh target/x86_64-apple-darwin/release/bundle/macos/Marvis.app x86_64-apple-darwin
      - name: Upload x86_64 bundles
        uses: actions/upload-artifact@v4
        with:
          name: marvis-x86_64-apple-darwin
          path: |
            apps/native/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            apps/native/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error

  package-windows:
    name: Package Marvis release candidate (windows x86_64)
    if: ${{ inputs.package_app == true }}
    needs: build-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: whisper-cli-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/whisper-cli-x86_64-pc-windows-msvc
      - name: Stage and validate exact windows artifact
        working-directory: apps/native/src-tauri
        run: |
          bash scripts/build-whisper-cli.sh --stage \
            "${{ runner.temp }}/whisper-cli-x86_64-pc-windows-msvc/whisper-cli-x86_64-pc-windows-msvc.exe" \
            --checksum "${{ runner.temp }}/whisper-cli-x86_64-pc-windows-msvc/whisper-cli-x86_64-pc-windows-msvc.exe.sha256" \
            --target x86_64-pc-windows-msvc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build windows release app (msi + nsis)
        working-directory: apps/native
        run: bun install --frozen-lockfile && bun run tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis
      - name: Verify bundle artifacts exist
        working-directory: apps/native/src-tauri
        run: |
          ls target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          ls target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
      - name: Upload windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: marvis-x86_64-pc-windows-msvc
          path: |
            apps/native/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            apps/native/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  package-linux:
    name: Package Marvis release candidate (linux x86_64)
    if: ${{ inputs.package_app == true }}
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri + capture/audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libdbus-1-dev libasound2-dev \
            libpipewire-0.3-dev libpulse-dev pkg-config
      - uses: actions/download-artifact@v4
        with:
          name: whisper-cli-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/whisper-cli-x86_64-unknown-linux-gnu
      - name: Stage and validate exact linux artifact
        working-directory: apps/native/src-tauri
        run: |
          bash scripts/build-whisper-cli.sh --stage \
            "${{ runner.temp }}/whisper-cli-x86_64-unknown-linux-gnu/whisper-cli-x86_64-unknown-linux-gnu" \
            --checksum "${{ runner.temp }}/whisper-cli-x86_64-unknown-linux-gnu/whisper-cli-x86_64-unknown-linux-gnu.sha256" \
            --target x86_64-unknown-linux-gnu
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build linux release app (AppImage + deb)
        working-directory: apps/native
        run: bun install --frozen-lockfile && bun run tauri build --target x86_64-unknown-linux-gnu --bundles appimage,deb
      - name: Verify bundle artifacts exist
        working-directory: apps/native/src-tauri
        run: |
          ls target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          ls target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
      - name: Upload linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: marvis-x86_64-unknown-linux-gnu
          path: |
            apps/native/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            apps/native/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error
