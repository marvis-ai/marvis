<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Marvis mark (tray, inverted)">
  <!-- Painted inverse of marvis-mark-template.svg for the Windows/Linux
       tray: those trays render real colour (no `iconAsTemplate`), so the
       light mark is painted ON the dark tile — macOS uses the knockout
       template instead, where the mark must be a transparent hole. -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="#31302e"/>
  <g fill="#f6f5f4">
    <path fill-rule="evenodd"
          d="M31.5 17.5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 1 1 15 0ZM26.9 17.5a2.9 2.9 0 1 1-5.8 0 2.9 2.9 0 1 1 5.8 0Z"/>
    <rect x="14" y="30" width="20" height="2.6" rx="1.3"/>
    <rect x="17.5" y="34.8" width="13" height="2.6" rx="1.3"/>
  </g>
</svg>
